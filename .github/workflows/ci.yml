name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Latest stable Go, so govulncheck reports what users of a current
      # toolchain are exposed to, not issues long fixed in a newer patch.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Layering
        # SDK types may only be imported by internal/sdkadapter, and the root
        # and auth packages must not depend on JOSE.
        run: |
          bad=$(go list -tags integration -f '{{.ImportPath}} {{join .Imports " "}} {{join .TestImports " "}} {{join .XTestImports " "}}' ./... \
            | grep 'modelcontextprotocol/go-sdk' | cut -d' ' -f1 | grep -vx 'go.xchunk.org/argon/internal/sdkadapter' || true)
          if [ -n "$bad" ]; then echo "SDK imported outside internal/sdkadapter:"; echo "$bad"; exit 1; fi
          if go list -deps . ./auth | grep -q go-jose; then echo "root/auth depend on go-jose"; exit 1; fi

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # "min" is the minimum Go version from go.mod at its latest patch;
        # "stable" is the current release.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [min]
        include:
          - os: ubuntu-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          if [ "${{ matrix.go }}" = min ]; then
            echo "version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1.x/p' go.mod)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.go }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  integration:
    name: Integration (Keycloak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Go version
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1.x/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
      - name: Start Keycloak
        run: docker compose -f test/keycloak/compose.yaml up -d --wait
      - name: Integration tests
        env:
          ARGON_REQUIRE_KEYCLOAK: "1"
        run: go test -tags integration -race -count=1 ./...
      - name: Keycloak logs
        if: failure()
        run: docker compose -f test/keycloak/compose.yaml logs
      - name: Stop Keycloak
        if: always()
        run: docker compose -f test/keycloak/compose.yaml down
