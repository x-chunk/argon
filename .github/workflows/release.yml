name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        # Take the section "## [<tag>] ..." up to the next "## [" heading.
        run: |
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $TAG"; exit 1; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          title="argon $TAG"
          flags=()
          case "$TAG" in
            *-preview.*) title="argon $TAG (Developer Preview ${TAG##*-preview.})"; flags+=(--prerelease) ;;
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md "${flags[@]}"
      - name: Warm the Go module proxy
        # Best effort: needs the go.xchunk.org vanity import to resolve.
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: curl -fsS "https://proxy.golang.org/go.xchunk.org/argon/@v/${TAG}.info"
